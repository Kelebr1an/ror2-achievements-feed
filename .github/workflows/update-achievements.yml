name: Update achievements

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: write

concurrency:
  group: achievements-main
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate Steam achievements
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python fetch_achievements.py
      - name: Commit successful snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/achievements.json
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Steam achievements'
          git pull --rebase origin main
          git push origin HEAD:main
